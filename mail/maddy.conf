# StrafeChat's bundled outbound mail relay: maddy (https://maddy.email), configured to do
# exactly one thing - take mail from the API over the private compose network and deliver
# it to the recipients' mail servers, DKIM-signed, over TLS, through a retry queue. It
# listens on no public port, accepts no inbound mail and keeps no mailboxes.
#
# Values come from docker-compose.yml:
#   MAIL_DOMAIN         the instance domain; the only sender domain relayed, and the DKIM
#                       signing domain (= DOMAIN)
#   MAIL_HOSTNAME       the name this relay introduces itself as (EHLO). Needs an A record
#                       to this host and a PTR record back - receiving servers check both.
#   MAIL_DKIM_SELECTOR  the DKIM selector; the key is generated on first start under
#                       /data/dkim_keys/<domain>_<selector>.key and the DNS record to
#                       publish is written beside it as <domain>_<selector>.dns.
# Everything else is explained in docs/EMAIL.md.

state_dir /data
runtime_dir /tmp

hostname {env:MAIL_HOSTNAME}
autogenerated_msg_domain {env:MAIL_DOMAIN}

# No TLS on the submission side: the only client is the API, one hop away on a Docker
# network nothing else is attached to (see `networks:` in docker-compose.yml). Delivery to
# the outside world is TLS - see outbound_delivery below.
tls off

# Submission from the API. The plain `smtp` endpoint rather than `submission`: that module
# insists on SASL authentication, and here the network is the credential - no other
# container can reach this port, and no port is published. The API already sets
# Message-ID and Date, the two things `submission` would add.
smtp tcp://0.0.0.0:587 {
    limits {
        all rate 20 1s
        all concurrency 10
    }
    # A verification or reset mail is a few kilobytes; nothing bigger should pass.
    max_message_size 2M
    dmarc no

    # Only mail from the instance's own domain is relayed, signed with its DKIM key. Any
    # other sender is refused, so a bug (or a compromised API) cannot send as someone else.
    source {env:MAIL_DOMAIN} {
        default_destination {
            modify {
                dkim {env:MAIL_DOMAIN} {env:MAIL_DKIM_SELECTOR}
            }
            deliver_to &remote_queue
        }
    }
    default_source {
        reject 501 5.1.8 "Sender domain is not this instance's"
    }
}

# Delivery straight to each recipient domain's MX, over TLS: a server that cannot do
# STARTTLS is refused (min_tls_level encrypted), and domains that publish MTA-STS or DANE
# policies get them enforced. This is why the host needs outbound port 25.
target.remote outbound_delivery {
    limits {
        destination rate 20 1s
        destination concurrency 10
    }
    mx_auth {
        dane
        mtasts {
            cache fs
            fs_dir mtasts_cache/
        }
        local_policy {
            min_tls_level encrypted
            min_mx_level none
        }
    }
}

# A temporary failure (a greylisting receiver, a server that is briefly down) is retried
# with exponential backoff for about two days before the message is dropped. No `bounce`
# block on purpose: this relay receives no mail, so there is no mailbox for a bounce to
# land in - a message that gives up is logged (`docker compose logs mail`) instead.
target.queue remote_queue {
    target &outbound_delivery
    max_tries 20
    autogenerated_msg_domain {env:MAIL_DOMAIN}
}
